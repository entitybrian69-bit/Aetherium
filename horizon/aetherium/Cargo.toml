# Aetherium for Horizon (Minecraft Java 26.3 in Rust), Vasysik/horizon-android.
# CI copies this folder into the pinned Horizon source as mods/aetherium, beside
# Horizon's own official mods, so it builds against the exact SDK of the APK.
[package]
name = "aetherium"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Aetherium for Horizon: Zume-style zoom, FPS and coordinates HUD, waypoints with on-screen markers and a death point"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../../crates/horizon-mod-sdk" }

[lints]
workspace = true
