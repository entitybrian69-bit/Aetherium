name: horizon-native
# Aetherium as a Horizon *native* mod (.hnmod, horizon-mixins): the real Aetherium settings screen
# inside Horizon's Options (desktop Horizon). The bundle is applied on the pinned Horizon commit and
# the game is type-checked with -D warnings. `[hnmod-release]` in the commit message publishes it.
on:
  push:
    branches: [arena/46f241da-aetherium]
    paths: ['horizon-native/**', '.github/workflows/horizon-native.yml', '!horizon-native/ci/out/**']
permissions:
  contents: write
concurrency:
  group: horizon-native-${{ github.ref }}
  cancel-in-progress: false
env:
  # The Rust the Horizon launcher builds native mods with.
  RUST: "1.99.1"
  HORIZON_REV: d91cab68ded29bd2b004f7050c468fb98c41a00b
  CARGO_TERM_COLOR: never
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      ok: ${{ steps.run.outputs.ok }}
      version: ${{ steps.run.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Rust and the libraries the game links against
        run: |
          rustup toolchain install "$RUST" --profile minimal && rustup default "$RUST"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libudev-dev rsync
          rustc --version; cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            horizon-native/target/horizon-mixins
            horizon-native/target/horizon
          key: hnmod-tools-${{ env.HORIZON_REV }}-${{ env.RUST }}-v1
      - uses: actions/cache@v4
        with:
          path: horizon-native/target/cargo
          key: hnmod-cargo-${{ env.HORIZON_REV }}-${{ env.RUST }}-${{ hashFiles('horizon-native/aetherium/mixins/**') }}
          restore-keys: hnmod-cargo-${{ env.HORIZON_REV }}-${{ env.RUST }}-
      - name: Apply on Horizon and check the game
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if bash horizon-native/ci/run.sh; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
          echo "version=$(cat horizon-native/ci/out/version.txt)" >> "$GITHUB_OUTPUT"
          cat horizon-native/ci/out/status.txt || true
          cat horizon-native/ci/out/*.errors.txt 2>/dev/null | head -200 || true
      - name: commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f horizon-native/ci/out 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "horizon-native: CI results for ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((i*5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.ok == '1'
        with:
          name: aetherium-hnmod
          path: dist/*
      - name: fail when the check failed
        if: steps.run.outputs.ok != '1'
        run: exit 1

  release:
    needs: check
    if: contains(github.event.head_commit.message, '[hnmod-release]') && needs.check.outputs.ok == '1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aetherium-hnmod
          path: dist
      - name: GitHub release
        run: |
          tag="hnmod-v$VERSION+26.3"
          f="dist/aetherium-$VERSION.hnmod"
          notes=$(mktemp)
          { cat horizon-native/release_notes.md;
            echo; echo "Built on Horizon \`${HORIZON_REV::7}\` ([horizon-rust/horizon](https://github.com/horizon-rust/horizon/commit/$HORIZON_REV))."
            echo; echo "SHA-256: \`$(cut -d' ' -f1 "$f.sha256")\`"; } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$f" "$f.sha256" --clobber
          else
            gh release create "$tag" "$f" "$f.sha256" --target "$GITHUB_SHA" --title "Aetherium $VERSION native mod for Horizon 26.3 (desktop)" --notes-file "$notes" --latest=false
          fi
          echo "::notice::release https://github.com/${{ github.repository }}/releases/tag/$tag"
