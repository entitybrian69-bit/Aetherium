[mod]
id = "aetherium"
version = "1.0.0"
priority = 100

# Aetherium hooks Horizon's Options screen itself (not only the native hook points), so it is
# pinned to the commit it was built and checked on: the launcher builds it on exactly this one.
[compatibility]
horizon_revision = "d91cab68ded29bd2b004f7050c468fb98c41a00b"

# Aetherium's settings screen, added to the Options screens as options_ui::aetherium.
[[module]]
id = "gui"
file = "crates/horizon-client-render/src/options_ui.rs"
name = "aetherium"
source = "gui.rs"
visibility = "pub"

# The game side: zoom, waypoints, overlay, markers, keys and commands (game::aetherium_rt).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "aetherium_rt"
source = "runtime.rs"

# ---- Options: Aetherium's page draws and handles input itself; Video Settings gets the button.

[[injection]]
id = "ui_draw"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::draw"
helper = "ui_draw.rs"
bindings = [
  { name = "ui", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "s", ty = "&crate::settings::Settings", value = "s" },
  { name = "batch", ty = "&mut crate::hud::HudBatch", value = "&mut *batch" },
  { name = "atlas", ty = "&crate::hud::HudAtlas", value = "atlas" },
  { name = "cursor", ty = "(f32, f32)", value = "cursor" },
]

[[injection]]
id = "ui_click"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::click"
helper = "ui_click.rs"
bindings = [
  { name = "ui", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "s", ty = "&mut crate::settings::Settings", value = "&mut *s" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "drag", ty = "bool", value = "drag" },
  { name = "right", ty = "bool", value = "right" },
]

[[injection]]
id = "ui_release"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::release"
helper = "ui_release.rs"
bindings = [
  { name = "ui", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
]

[[injection]]
id = "ui_wheel"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::wheel"
helper = "ui_wheel.rs"
bindings = [
  { name = "ui", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "s", ty = "&mut crate::settings::Settings", value = "&mut *s" },
  { name = "amount", ty = "f32", value = "amount" },
]

[[injection]]
id = "ui_key"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::key"
helper = "ui_key.rs"
bindings = [
  { name = "ui", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "s", ty = "&mut crate::settings::Settings", value = "&mut *s" },
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
]

[[injection]]
id = "ui_rows"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::list_rows"
helper = "ui_rows.rs"
bindings = [
  { name = "ui", ty = "&crate::options_ui::OptionsUi", value = "self" },
  { name = "s", ty = "&crate::settings::Settings", value = "s" },
]

# ---- The game's native hook points.

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "wheel"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_wheel"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "zoom"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom"
helper = "zoom.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "&mut *zoom" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
